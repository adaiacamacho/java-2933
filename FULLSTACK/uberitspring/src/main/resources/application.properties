spring.application.name=uberitspring

spring.datasource.url=jdbc:mysql://localhost:3306/uberitspring
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.data.rest.base-path=/api/v1

# true
spring.mvc.problemdetails.enabled=false

springdoc.enable-data-rest=false
springdoc.api-docs.path=/api/v2/apidocs
springdoc.swagger-ui.path=/api/v2/swagger
scalar.path=/api/v2/scalar

spring.devtools.livereload.enabled=true
spring.thymeleaf.cache=false

seguridad.jwt.secreto=${JWT_SECRET}
seguridad.jwt.caducidad=900

logging.level.org.springframework.security=DEBUG
