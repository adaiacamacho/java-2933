<!DOCTYPE html>
<html th:replace="~{_global :: plantilla(~{::title}, ~{::main})}"
	xmlns:th="https://www.thymeleaf.org">
<title>UberitSpring</title>
<main class="container">
	<form action="index.html" th:action="@{/registro}" th:method="post"
		th:object="${usuarioFormModel}" class="needs-validation" novalidate>
		<div class="row mb-3">
			<label for="nombre" class="col-sm-2 col-form-label">Nombre</label>
			<div class="col-sm">
				<input type="text" required maxlength="20" class="form-control"
					th:errorclass="is-invalid" th:field="*{nombre}">
				<div class="invalid-feedback">El nombre debe estar rellenado y
					tener como máximo 20 caracteres</div>
			</div>
		</div>
		<div class="row mb-3">
			<label for="email" class="col-sm-2 col-form-label">Email</label>
			<div class="col-sm">
				<input type="email" required maxlength="100" class="form-control"
					th:errorclass="is-invalid" th:field="*{email}">
				<div class="invalid-feedback">El email debe estar rellenado,
					tener el formato adecuado y tener como máximo 100 caracteres</div>
			</div>
		</div>
		<div class="row mb-3">
			<label for="password" class="col-sm-2 col-form-label">Contraseña</label>
			<div class="col-sm">
				<input type="password" required maxlength="100" class="form-control"
					th:errorclass="is-invalid" th:field="*{password}">
				<div class="invalid-feedback">La contraseña debe estar
					rellenada y tener como máximo 100 caracteres</div>
			</div>
		</div>
		<div class="row mb-3">
			<div class="offset-sm-2 col-sm">
				<button type="submit" class="btn btn-primary">Registrarme</button>
			</div>
		</div>
	</form>
	<script>
	// Example starter JavaScript for disabling form submissions if there are invalid fields
	(() => {
	  'use strict'

	  // Fetch all the forms we want to apply custom Bootstrap validation styles to
	  const forms = document.querySelectorAll('.needs-validation')

	  // Loop over them and prevent submission
	  Array.from(forms).forEach(form => {
	    form.addEventListener('submit', event => {
	      if (!form.checkValidity()) {
	        event.preventDefault()
	        event.stopPropagation()
	        
	        const div = document.createElement('div');
	        
	        div.className = "alert alert-danger alert-dismissible fade show";
	        div.role = "alert";
	        
	        div.innerHTML = `
	    		<span>Hay errores en los campos de usuario</span>
	    		<button type="button" class="btn-close" data-bs-dismiss="alert"
	    			aria-label="Close"></button>`;
	    	
	    	document.querySelector('body>nav').insertAdjacentElement("afterend", div);
	      }

	      form.classList.add('was-validated')
	    }, false)
	  })
	})()
	</script>
</main>
</html>
