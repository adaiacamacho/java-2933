<!DOCTYPE html>
<html class="h-100" lang="es"
	th:fragment="plantilla (titulo, contenido)"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:replace="${titulo}">UberitSpring</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
</head>
<body class="h-100 d-flex flex-column">
	<nav class="navbar navbar-expand-sm bg-dark" data-bs-theme="dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">UberitSpring</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-sm-0">
					<li class="nav-item"><a class="nav-link" href="#"
						th:href="@{/}">Principal</a></li>
				</ul>
				<ul class="navbar-nav mb-2 mb-sm-0">
					<li class="nav-item" sec:authorize="!isAuthenticated()"><a class="nav-link" href="#"
						th:href="@{/login}">Iniciar sesión</a></li>
					<li class="nav-item" sec:authorize="!isAuthenticated()"><a class="nav-link" href="#"
						th:href="@{/registro}">Registrarme</a></li>
					<li class="navbar-text" sec:authentication="name" sec:authorize="isAuthenticated()">USUARIO</li>
					<li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" href="#"
						th:href="@{/logout}">Cerrar sesión</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div th:if="${alerta}" class="alert alert-dismissible fade show"
		th:classappend="${'alert-' + alerta.nivel}" role="alert">
		<span th:text="${alerta.mensaje}">MENSAJE</span>
		<button type="button" class="btn-close" data-bs-dismiss="alert"
			aria-label="Close"></button>
	</div>

	<div class="my-5">
		<main th:replace="${contenido}">
			<p>Layout content</p>
		</main>
	</div>

	<footer class="p-2 text-bg-dark mt-auto"> &copy;2026 Javier
		Lete </footer>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>
</html>
