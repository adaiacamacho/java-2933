<!DOCTYPE html>
<html th:replace="~{_global :: plantilla(~{::title}, ~{::main})}"
	xmlns:th="https://www.thymeleaf.org">
<title>UberitSpring: Restaurante</title>
<main class="container">
	<div class="card mb-5">
		<img src="https://picsum.photos/400/100" height="100" class="card-img-top"
			alt="...">
		<div class="card-body">
			<h5 class="card-title" th:text="${restaurante.nombre}">Card
				title</h5>
			<ul class="card-text">
				<li th:each="tipoComida: ${restaurante.tiposComida}"
					th:text="${tipoComida}">TIPO1</li>
			</ul>
		</div>
	</div>

	<table class="table">
		<caption>Platos</caption>

		<thead>
			<tr>
				<th>Nombre</th>
				<th>Descripción</th>
				<th class="text-end">Precio</th>
				<th>OPCIONES</th>
			</tr>
		</thead>

		<tbody>
			<tr th:each="plato: ${restaurante.platos}" th:object="${plato}">
				<th th:text="*{nombre}">COMIDA</th>
				<td th:text="*{descripcion}">DESCRIPCION</td>
				<td class="text-end" th:text="*{precio}">PRECIO</td>
				<td>
					<a class="btn btn-sm btn-primary" th:href="@{/usuario/carrito/agregar(id=*{id})}" href="#"><i class="bi bi-plus-lg"></i></a>
				</td>
			</tr>
		</tbody>
	</table>
</main>
