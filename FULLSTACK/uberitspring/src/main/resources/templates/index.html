<!DOCTYPE html>
<html th:replace="~{_global :: plantilla(~{::title}, ~{::main})}"
	xmlns:th="https://www.thymeleaf.org">
<title>UberitSpring: Listado</title>
<main class="container">
	<table class="table">
		<caption>Restaurantes</caption>

		<thead>
			<tr>
				<th>Nombre</th>
				<th>Tipo de comida</th>
			</tr>
		</thead>

		<tbody>
			<tr th:each="restaurante: ${restaurantes}">
				<th><a th:text="${restaurante.nombre}"
					th:href="@{/restaurante/{id}(id=${restaurante.id})}" href="restaurante.html">TeleBurger</a>
				</th>
				<td>
					<ul>
						<li th:each="tipoComida: ${restaurante.tiposComida}"
							th:text="${tipoComida}">Americana</li>
					</ul>
				</td>
			</tr>
		</tbody>
	</table>
</main>
</html>
