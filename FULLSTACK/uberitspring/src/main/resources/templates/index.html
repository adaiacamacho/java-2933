<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>UberitSpring</title>
</head>
<body>

<h1>UberitSpring</h1>

<table>
	<caption>Restaurantes</caption>
	
	<thead>
		<tr>
			<th>Nombre</th>
			<th>Tipo de comida</th>
		</tr>
	</thead>
	
	<tbody>
		<tr th:each="restaurante: ${restaurantes}">
			<th th:text="${restaurante.nombre}">TeleBurger</th>
			<td>
				<ul>
					<li th:each="tipoComida: ${restaurante.tiposComida}" th:text="${tipoComida}">Americana</li>
				</ul>
			</td>
		</tr>
	</tbody>
</table>

</body>
</html>
