<!DOCTYPE html>
<html th:replace="~{_global :: plantilla(~{::title}, ~{::main})}"
	xmlns:th="https://www.thymeleaf.org">
<title>UberitSpring</title>
<main class="container">
	<h1>Administración</h1>

	<table class="table table-hover table-striped table-bordered">
		<thead class="table-secondary">
			<tr>
				<th>Id</th>
				<th>Nombre</th>
				<th>Tipos de comida</th>
				<th>OPCIONES</th>
			</tr>
		</thead>
		
		<tbody>
			<tr th:each="restaurante: ${restaurantes}" th:object="${restaurante}">
				<th th:text="*{id}">1</th>
				<td th:text="*{nombre}">La Traviata</td>
				<td th:text="*{tiposComida}">Italiana, Mediterránea</td>
				<td>
					<a href="#" th:href="@{/admin/restaurantes/formulario/{id}(id=*{id})}" class="btn btn-sm btn-primary"><i class="bi bi-pencil-fill"></i></a>
					<a href="#" th:href="@{/admin/restaurantes/borrar(id=*{id})}" class="btn btn-sm btn-danger"><i class="bi bi-trash-fill"></i></a>
				</td>
			</tr>
		</tbody>
		
		<tfoot class="table-secondary">
			<tr>
				<td colspan="3"></td>
				<td>
					<a href="#" th:href="@{/admin/restaurantes/formulario}" class="btn btn-sm btn-primary"><i class="bi bi-plus-lg"></i></a>
				</td>
			</tr>
		</tfoot>
	</table>
</main>
</html>
