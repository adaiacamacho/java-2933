<!DOCTYPE html>
<html lang="es" class="h-100">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IparTube</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
<script defer
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>
<script type="module" src="js/index.js"></script>
</head>
<body class="h-100 d-flex flex-column">
	<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="javascript:listado()">IparTube</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link"
						href="javascript:listado()">Principal</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="container my-5 flex-grow-1">
		<section id="listado">
			<h2>Listado de videos</h2>
			<div id="listado-videos" class="row row-cols-1 row-cols-md-3 g-4">

			</div>
		</section>

		<section id="detalle" class="offset-lg-2 col-lg-8">
			<div class="card">
				<div class="ratio ratio-16x9 card-img-top">
					<iframe src="" title="" allowfullscreen></iframe>
				</div>
				<div class="card-body">
					<h5 class="card-title"></h5>
					<p class="card-text"></p>
				</div>
				<div class="card-footer">
					<small class="text-body-secondary"></small>
				</div>
			</div>

			<ul class="mt-4 list-group">
				<li
					class="list-group-item d-flex justify-content-between align-items-start py-4">
					<div class="ms-2 w-100">
						<div class="d-flex">
							<div class="fw-bold me-auto">
								<input id="comentario-nombre" class="form-control">
							</div>
							<span class="badge text-bg-primary rounded-pill align-self-baseline">2026-09-01
								11:34</span>
						</div>
						<textarea id="comentario-texto" class="form-control col"></textarea>
						<button class="btn btn-primary">Enviar comentario</button>
					</div>
				</li>
				<li
					class="list-group-item d-flex justify-content-between align-items-start">
					<div class="ms-2 me-auto">
						<div class="fw-bold">Pepe</div>
						Me gusta este video
					</div> <span class="badge text-bg-primary rounded-pill">2026-09-01
						11:34</span>
				</li>
				<li
					class="list-group-item d-flex justify-content-between align-items-start">
					<div class="ms-2 me-auto">
						<div class="fw-bold">Juan</div>
						Este tío me cae mal
					</div> <span class="badge text-bg-primary rounded-pill">2026-09-01
						11:34</span>
				</li>
				<li
					class="list-group-item d-flex justify-content-between align-items-start">
					<div class="ms-2 me-auto">
						<div class="fw-bold">Pedro</div>
						Pues a mí me gusta
					</div> <span class="badge text-bg-primary rounded-pill">2026-09-01
						11:34</span>
				</li>
			</ul>
		</section>
	</main>

	<footer class="text-bg-dark p-2">
		<p>&copy;2026 Javier Lete</p>
	</footer>
</body>
</html>
