<table class="table">
  <caption>
    Restaurantes
  </caption>

  <thead>
    <tr>
      <th>Nombre</th>
      <th>Tipo de comida</th>
    </tr>
  </thead>

  <tbody>
    @for (restaurante of restaurantes(); track restaurante.id) {
      <tr [restaurante]="restaurante" (clic)="verRestaurante($event)"></tr>
    }
  </tbody>
</table>
