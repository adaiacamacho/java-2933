<form>
  <div class="row mb-3">
    <label for="nombre" class="col-sm-2 col-form-label">Nombre</label>
    <div class="col-sm">
      <input
        type="text"
        required
        maxlength="20"
        class="form-control"
        th:errorclass="is-invalid"
        th:field="*{nombre}"
      />
      <div class="invalid-feedback">
        El nombre debe estar rellenado y tener como máximo 20 caracteres
      </div>
    </div>
  </div>
  <fieldset class="row mb-3">
    <legend class="col-form-label col-sm-2 pt-0">Tipos de comida</legend>
    <div class="col-sm-10 offset-sm-2">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="gridCheck1" />
        <label class="form-check-label" for="gridCheck1"> Americana </label>
      </div>
    </div>
    <div class="col-sm-10 offset-sm-2">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="gridCheck2" />
        <label class="form-check-label" for="gridCheck2"> Española </label>
      </div>
    </div>
  </fieldset>
  <div class="row mb-3">
    <div class="offset-sm-2 col-sm">
      <button type="submit" class="btn btn-primary">Registrarme</button>
    </div>
  </div>
</form>
